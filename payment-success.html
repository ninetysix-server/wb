<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Success - 96 Studios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 20px;
        }
        .success-card {
            background: white;
            padding: 60px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .success-icon {
            font-size: 72px;
            color: #10b981;
            margin-bottom: 20px;
        }
        .success-card h1 {
            color: #004370;
            margin-bottom: 10px;
        }
        .success-card p {
            color: #64748b;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #009B5B, #007a48);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,155,91,0.3);
        }
        .order-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
        }
        .order-info p {
            margin: 8px 0;
        }
        .home-link {
            color: #009B5B;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 12px;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <h1>Payment Successful!</h1>
            <p>Your payment has been confirmed. We'll start working on your design shortly.</p>
            <div class="order-info" id="orderInfo">
                <p>Order ID: <strong id="orderIdDisplay">Loading...</strong></p>
                <p>You will receive a confirmation email shortly.</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;">
                <a href="orders.html" class="btn-primary"><i class="fas fa-box"></i> View My Orders</a>
                <a href="index.html" class="home-link">← Back to Home</a>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        if (orderId) {
            document.getElementById('orderIdDisplay').textContent = orderId;
        }
    </script>
</body>
</html>
